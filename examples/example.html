<html>

<head>
	<style>
		body {
			display: flex;
			padding: 0;
			margin: 0;
			background: bisque;
			height: 100%;
		}

		* {
			box-sizing: border-box;
		}

		body,
		html {
			font-family: Arial, Helvetica, sans-serif;
		}

		pre code {
			font-size: 16px;
			tab-size: 4;
			border-radius: 10px;
			/* Change 4 to the number of spaces you want */
		}

		#navbar {
			flex-shrink: 0;
			width: 180px;
			background: blueviolet;
			margin-right: 10px;
			padding: 20px;
			color: white;
			font-size: 18px;
			display: flex;
			flex-direction: column;
			gap: 10px;

			a {
				display: block;
				color: white;
			}
		}

		#highlights {
			overflow: auto;
			flex-grow: 1;
		}
	</style>
	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/atom-one-dark.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
	<script>hljs.highlightAll();</script>

</head>

<body>
	<div id="navbar">
	</div>
	<div id="highlights">

	</div>
	<script src="example.js"></script>
</body>

</html>
