<!-- create a button element with a function connected to its onclick event -->
<button onclick="some_function()">Click Me!</button>


<!-- create an image src can be a local file or a URL address -->
<img src="some_picture.png" />


<!-- create an input, users can type into this box, values can be retrieve or set in scripts -->
<input id="input_name" placeholder="What is your name?" onkeypress="if(event.key === 'Enter') do_something()" />

<!-- multiline input element -->
<textarea cols="5">
</textarea>

<!-- A select element allows a user to select a single value from a list of options -->
<select id="select_frutit">
	<option>Apples</option>
	<option>Oranges</option>
</select>

<!-- some paragraph -->
<p>Some paragraph</p>

<!-- header elements are label but let the browser know how important this section is -->
<h1>Some Header</h1>
<h2>Some smaller Header</h2>
<h3>Some samller Header</h3>
<h4>Some smaller header</h4>

<!-- Links (anchors)-->
<a href="https://google.com">Google.com</a>
<!-- open in new tab -->
<a href="https://google.com" target="_blank">Google.com</a>
<!-- internal link on your page -->
<a href="#section_abc">Section Abc</a>
<!-- link to local page -->
<a href="/page2.html">Page 2</a>

<a onclick="do_something()">Click Me!</a>


<!-- containers -->
<div>
	div is a block container, will stack vertically
</div>

<span>
	span is an inline container, will position itself next the the previous "inline" element
</span>
