<html>

<head>
	<script src="logic.js"></script>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<h1 style="color:red">Tic Tac Toe</h1>
	<div id="winner"></div>
	<button id="bt_start" onclick="start()">Start</button>
	<div id="turn" style="font-size: 20px;">X Turn</div>

	<div id="ttt_buttons">
		<button onclick="handleClick(event, 0,0)">CLICK ME!</button>
		<button onclick="handleClick(event, 1,0)">CLICK ME!</button>
		<button onclick="handleClick(event, 2,0)">CLICK ME!</button>
		<br />

		<button onclick="handleClick(event, 0,1)">CLICK ME!</button>
		<button onclick="handleClick(event, 1,1)">CLICK ME!</button>
		<button onclick="handleClick(event, 2,1)">CLICK ME!</button>
		<br />
		<button onclick="handleClick(event, 0,2)">CLICK ME!</button>
		<button onclick="handleClick(event, 1,2)">CLICK ME!</button>
		<button onclick="handleClick(event, 2,2)">CLICK ME!</button>
	</div>
</body>

</html>
